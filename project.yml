name: Agacha
options:
  bundleIdPrefix: br.com.agacha
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: pt-BR
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
packages:
  AganhaCore:
    path: Packages/AganhaCore
  AganhaVision:
    path: Packages/AganhaVision
  AganhaAudio:
    path: Packages/AganhaAudio
  AganhaUI:
    path: Packages/AganhaUI
  AganhaStore:
    path: Packages/AganhaStore
  AganhaTV:
    path: Packages/AganhaTV
targets:
  Agacha:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: AganhaCore
      - package: AganhaVision
      - package: AganhaAudio
      - package: AganhaUI
      - package: AganhaStore
      - package: AganhaTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.agacha.agacha
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Agacha
        CFBundleLocalizations: [pt-BR, en]
        NSLocalNetworkUsageDescription: O Agacha mostra o jogo na TV pelo navegador dela, dentro da sua rede Wi-Fi. Nada vai para a internet.
        NSMicrophoneUsageDescription: O microfone ouve o nome de cada jogador para a tia poder chamar cada um pelo nome. O som só é usado para entender o nome e não é gravado pelo app.
        NSSpeechRecognitionUsageDescription: O reconhecimento de fala entende o nome dito pelo jogador. Quando possível é feito no próprio aparelho; senão, o som pode ser enviado à Apple apenas para reconhecer a fala. Nada é gravado pelo app.
        NSCameraUsageDescription: A câmera identifica quem está de pé ou agachado. As imagens são processadas no aparelho e nunca são enviadas. No replay de um erro, alguns segundos de vídeo ficam guardados temporariamente e são apagados em seguida.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Só para o spike/dev: expõe a pasta Documents no app Arquivos (fixtures de esqueletos).
        # Remover antes da Fase 3 (App Store).
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
schemes:
  Agacha:
    build:
      targets:
        Agacha: all
    run:
      config: Debug
    archive:
      config: Release
